<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeCal</title>
    <link rel="icon" type="image/png" href="icons/icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #f8fafc;
            color: #1e293b;
        }

        .lang-card {
            text-align: center;
            padding: 48px 56px;
            background: #ffffff;
            border: 3px solid #1e293b;
            border-radius: 12px;
            box-shadow: 8px 8px 0px #1e293b;
        }

        .lang-card h1 {
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 8px;
        }

        .lang-card p {
            color: #64748b;
            margin-bottom: 32px;
            font-size: 1rem;
        }

        .lang-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .lang-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 140px;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            color: #ffffff;
            background: #4f46e5;
            border: 3px solid #1e293b;
            border-radius: 8px;
            box-shadow: 4px 4px 0px #1e293b;
            transition: all 0.2s ease;
        }

        .lang-btn.secondary {
            background: #ffffff;
            color: #1e293b;
        }

        .lang-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #1e293b;
        }
    </style>
    <script>
        // 按浏览器语言自动跳转；加载失败或禁用 JS 时可在页面手动选择
        (function () {
            var isZh = (navigator.language || 'zh').toLowerCase().indexOf('zh') === 0;
            location.replace(isZh ? 'zh-CN/index.html' : 'en/index.html');
        })();
    </script>
</head>

<body>
    <main class="lang-card">
        <h1>CodeCal</h1>
        <p>编程竞赛日历 · Contest Calendar</p>
        <div class="lang-buttons">
            <a class="lang-btn" href="zh-CN/index.html">中文</a>
            <a class="lang-btn secondary" href="en/index.html">English</a>
        </div>
    </main>
</body>

</html>
