<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="icons/icon.png">
    <title>近15天到未来一个月的比赛日历</title>
    <script src="main.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/@popperjs/core@2"></script>
    <script src="https://unpkg.com/tippy.js@6"></script>
    <link rel="stylesheet" href="https://unpkg.com/tippy.js@6/themes/light.css">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <link rel="stylesheet" href="calendar.css">
    <link rel="stylesheet" href="platform-tag.css">
</head>

<body>
    <div id="app" class="container">
        <nav class="view-switcher">
            <a href="index.html" class="nav-link">列表视图</a>
            <a href="calendar.html" class="nav-link active">日历视图</a>
        </nav>

        <div id="calendar"></div>
    </div>

    <script>
        const { createApp } = Vue

        createApp({
            data() {
                return {
                    contests: [],
                    calendar: null,
                    theme: localStorage.getItem('theme') || 'light'
                }
            },
            created() {
                document.documentElement.setAttribute('data-theme', this.theme);
            },
            mounted() {
                this.fetchContests().then(() => {
                    this.initCalendar()
                })
            },
            methods: {
                toggleTheme() {
                    this.theme = this.theme === 'light' ? 'dark' : 'light';
                    document.documentElement.setAttribute('data-theme', this.theme);
                    localStorage.setItem('theme', this.theme);
                    
                    // 重新渲染日历以更新样式
                    if (this.calendar) {
                        this.calendar.render();
                    }
                },
                async fetchContests() {
                    try {
                        const response = await fetch('contests.json')
                        const data = await response.json()
                        this.contests = data.contests
                    } catch (error) {
                        console.error('Error fetching contests:', error)
                    }
                },
                initCalendar() {
                    this.calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
                        initialView: 'timeGridWeek',
                        nowIndicator: true,
                        nowIndicatorClassNames: ['fc-timegrid-now'],
                        nowIndicatorDidMount: (el) => {
                            if (this.calendar.view.type === 'timeGridDay') {
                                el.style.backgroundColor = 'rgba(255, 200, 200, 0.3)';
                                
                                // 添加定时器每5分钟更新红线位置
                                setInterval(() => {
                                    const now = new Date();
                                    const start = this.calendar.view.activeStart;
                                    const end = this.calendar.view.activeEnd;
                                    const totalMinutes = (end - start) / (1000 * 60);
                                    const currentMinutes = (now - start) / (1000 * 60);
                                    const percentage = (currentMinutes / totalMinutes) * 100;
                                    
                                    el.style.top = `${Math.min(100, Math.max(0, percentage))}%`;
                                }, 5 * 60 * 1000); // 每5分钟更新一次
                            }
                        },
                        events: this.contests.map(contest => ({
                            title: contest.name,
                            start: new Date(contest.start_time),
                            end: new Date(new Date(contest.start_time).getTime() + contest.duration * 60000),
                            extendedProps: {
                                platform: contest.platform,
                                url: contest.url
                            }
                        })),
                        eventContent: this.renderEventContent,
                        headerToolbar: {
                            left: 'prev,next today',
                            center: 'title',
                            right: 'timeGridWeek,dayGridMonth'
                        },
                        buttonText: {
                            today: '今天',
                            month: '月',
                            week: '周',
                            day: '日',
                            listWeek: '周列表',
                            listMonth: '月列表',
                            listDay: '日列表'
                        },
                        eventDidMount: (info) => {
                            const event = info.event;
                            const startTime = event.start;
                            const now = new Date();
                            const diff = startTime - now;
                            
                            let statusText, statusColor, statusIcon;
                            
                            if (diff > 0) {
                                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                                
                                if (days > 0) {
                                    statusText = `${days}天后开始`;
                                } else if (hours > 0) {
                                    statusText = `${hours}小时后开始`;
                                } else {
                                    statusText = `${minutes}分钟后开始`;
                                }
                                statusColor = '#22c55e';
                                statusIcon = '📅';
                            } else {
                                const elapsed = Math.abs(diff);
                                const hours = Math.floor(elapsed / (1000 * 60 * 60));
                                const minutes = Math.floor((elapsed % (1000 * 60 * 60)) / (1000 * 60));
                                
                                if (hours > 0) {
                                    statusText = `已进行 ${hours}小时${minutes}分钟`;
                                } else {
                                    statusText = `已进行 ${minutes}分钟`;
                                }
                                statusColor = '#ef4444';
                                statusIcon = '🔥';
                            }
                            
                            tippy(info.el, {
                                content: `
                                    <div style="padding: 12px; min-width: 200px;">
                                        <div style="font-weight: 600; font-size: 14px; margin-bottom: 8px; color: #1f2937;">${event.title}</div>
                                        <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 6px;">
                                            <span style="font-size: 12px;">🏆</span>
                                            <span style="font-size: 12px; color: #6b7280;">${event.extendedProps.platform}</span>
                                        </div>
                                        <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 8px;">
                                            <span style="font-size: 12px;">🕐</span>
                                            <span style="font-size: 12px; color: #6b7280;">${startTime.toLocaleString('zh-CN', { 
                                                year: 'numeric', 
                                                month: '2-digit', 
                                                day: '2-digit', 
                                                hour: '2-digit', 
                                                minute: '2-digit' 
                                            })}</span>
                                        </div>
                                        <div style="display: flex; align-items: center; gap: 6px; padding-top: 8px; border-top: 1px solid #e5e7eb;">
                                            <span style="font-size: 14px;">${statusIcon}</span>
                                            <span style="font-size: 13px; font-weight: 500; color: ${statusColor};">${statusText}</span>
                                        </div>
                                    </div>
                                `,
                                placement: 'top',
                                theme: 'light',
                                arrow: true,
                                animation: 'fade',
                                delay: [100, 0]
                            });
                        },
                        eventClick: this.handleEventClick
                    })
                    this.calendar.render()
                },
                renderEventContent(eventInfo) {
                    return {
                        html: `<div class="fc-event-content">
                            <div class="platform-tag ${eventInfo.event.extendedProps.platform.toLowerCase()}">
                                ${eventInfo.event.extendedProps.platform} <div class="event-title">${eventInfo.event.title}</div>
                            </div>
                        </div>`
                    }
                },
                handleEventClick(info) {
                    window.open(info.event.extendedProps.url, '_blank')
                }
            }
        }).mount('#app')
    </script>
    <footer class="footer">
        <p>© 2025 ChanYeeSum. All rights reserved.</p>
    </footer>
</body>

</html>
